<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>साउंड स्कैनर कैलिब्रेटेड</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #111; color: #fff; padding: 20px; }
        h1 { color: #00a8ff; font-size: 24px; }
        .btn { display: block; width: 90%; max-width: 350px; margin: 20px auto; padding: 22px; font-size: 20px; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; }
        .btn-start { background-color: #28a745; box-shadow: 0 4px 15px rgba(40,167,69,0.4); }
        .btn-scan { background-color: #007bff; box-shadow: 0 4px 15px rgba(0,123,255,0.4); }
        #status { font-size: 22px; font-weight: bold; margin: 30px auto; padding: 20px; width: 85%; max-width: 350px; border-radius: 8px; background-color: #222; border: 2px solid #00a8ff; color: #00e676; }
    </style>
</head>
<body>

    <h1>ध्वनि तरंग वॉटर स्कैनर (कैलिब्रेटेड संस्करण)</h1>
    <p style="font-size: 14px; color: #aaa;">यह कोड हर फोन के माइक के हिसाब से ऑटो-एडजस्ट होगा</p>
    
    <button class="btn btn-start" onclick="initAudio()">१. माइक और ऑडियो ऑन करें</button>
    <button class="btn btn-scan" onclick="startSonarScan()">२. पानी का स्तर जांचें</button>

    <div id="status" aria-live="assertive" role="alert">स्थिति: सिस्टम तैयार है। कृपया पहला बटन दबाएं।</div>

    <script>
        let audioCtx = null;
        let analyser = null;
        let microphone = null;
        let statusDiv = document.getElementById('status');

        async function initAudio() {
            statusDiv.innerText = "स्थिति: ऑडियो सिस्टम लोड हो रहा है...";
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // इस बार सामान्य सेटिंग्स रखी हैं ताकि माइक ओवर-सेंसिटिव न हो
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                microphone.connect(analyser);
                analyser.fftSize = 256; // तेज़ प्रोसेसिंग के लिए बफ़र छोटा किया
                
                statusDiv.innerText = "स्थिति: माइक तैयार है। अब टेस्ट शुरू करें और दूसरा बटन दबाएं।";
            } catch (err) {
                statusDiv.innerText = "त्रुटि: माइक एक्सेस नहीं मिला।";
            }
        }

        function startSonarScan() {
            if (!audioCtx || !analyser) {
                statusDiv.innerText = "त्रुटि: कृपया पहले १ नंबर बटन दबाकर माइक ऑन करें।";
                return;
            }

            statusDiv.innerText = "स्थिति: ध्वनि तरंगें भेजी जा रही हैं...";

            // बीप ध्वनि पैदा करना
            let oscillator = audioCtx.createOscillator();
            let playGain = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(2000, audioCtx.currentTime); // 2kHz फ्रीक्वेंसी
            
            oscillator.connect(playGain);
            playGain.connect(audioCtx.destination);
            
            oscillator.start();
            playGain.gain.setValueAtTime(0.5, audioCtx.currentTime); // वॉल्यूम आधा किया ताकि कान को न चुभे
            playGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            oscillator.stop(audioCtx.currentTime + 0.04);

            setTimeout(() => {
                let bufferLength = analyser.frequencyBinCount;
                let dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);
                
                // लाइव गूँज का कुल वॉल्यूम निकालना
                let totalVolume = 0;
                for (let i = 0; i < bufferLength; i++) {
                    totalVolume += dataArray[i];
                }
                let averageVolume = totalVolume / bufferLength;

                // --- नया ऑटो-स्केल कैलिब्रेशन फॉर्मूला ---
                // अगर माइक दबाने या सन्नाटे में वैल्यू बहुत कम (जैसे 2 से कम) है तो इसे सीधा 10% बताएगा
                let detectedLevel = 10;

                if (averageVolume > 1.5) {
                    // वॉल्यूम के आधार पर २०% से १००% के बीच डायनामिक स्केल
                    // यह फॉर्मूला अब ओवर-फ्लो नहीं होगा
                    let rawLevel = 10 + (averageVolume * 1.8); 
                    detectedLevel = Math.round(rawLevel / 5) * 5;
                }

                // सीमाओं को सुरक्षित करना
                if (detectedLevel > 100) detectedLevel = 100;
                if (detectedLevel < 10) detectedLevel = 10;

                // परिणाम सुनाना
                if (detectedLevel <= 10) {
                    statusDiv.innerText = `चेतावनी: पानी बहुत कम है, केवल ${detectedLevel} प्रतिशत है। कृपया पानी भरें।`;
                } else {
                    statusDiv.innerText = `स्थिति: ध्वनि सेंसर के अनुसार कूलर में ${detectedLevel} प्रतिशत पानी उपलब्ध है।`;
                }

            }, 350); 
        }
    </script>
</body>
</html>
